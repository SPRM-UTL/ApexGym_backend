openapi: 3.0.3
info:
  title: ApexGym API - Módulo de Notificaciones
  version: 1.0.0
  description: >
    Contrato OpenAPI para el módulo de notificaciones de ApexGym (PLAN-007).
    Define los endpoints para creación, consulta, conteo de no leídas y
    actualización de estado (leída/ignorada) de notificaciones genéricas para Android y web,
    así como registro de tokens FCM de dispositivos.
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

paths:
  /api/notificaciones:
    post:
      summary: Crear notificación
      description: >
        Crea una nueva notificación dirigida a un cliente o a un empleado.
        Acceso restringido: solo empleados autenticados pueden crear notificaciones.
      tags:
        - Notificaciones
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearNotificacionRequest'
      responses:
        '201':
          description: Notificación creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionResponse'
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (solo empleados pueden crear)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Destinatario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar notificaciones del usuario autenticado
      description: >
        Devuelve el listado de notificaciones dirigidas al usuario autenticado (cliente o empleado),
        ordenadas de forma descendente por fecha de creación (createdAt DESC).
        Un cliente solo puede consultar sus propias notificaciones; si intenta pedir ajenas, 403.
      tags:
        - Notificaciones
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado de la notificación
          schema:
            type: string
            enum: [PENDIENTE, LEIDA, IGNORADA]
        - name: tipo
          in: query
          required: false
          description: Filtrar por tipo de notificación
          schema:
            type: string
            example: GENERAL
      responses:
        '200':
          description: Listado de notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionesListResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Prohibido acceder a notificaciones ajenas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Filtros no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notificaciones/no-leidas/count:
    get:
      summary: Contador de notificaciones no leídas
      description: >
        Devuelve la cantidad de notificaciones con estado PENDIENTE correspondientes al usuario
        autenticado. Utilizado para alimentar el badge en la aplicación Android.
      tags:
        - Notificaciones
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Conteo de no leídas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionCountResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta autenticada no tiene un destinatario asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notificaciones/{id}/leida:
    patch:
      summary: Marcar notificación como leída
      description: >
        Actualiza el estado de la notificación a LEIDA y registra la fecha de lectura en leidaAt.
        Solo el destinatario de la notificación puede realizar esta acción; de lo contrario devuelve 403.
        Si la notificación no existe, devuelve 404.
      tags:
        - Notificaciones
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la notificación
          schema:
            type: integer
      responses:
        '200':
          description: Notificación marcada como leída exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado (la notificación pertenece a otro usuario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notificación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: ID de notificación no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notificaciones/{id}/ignorada:
    patch:
      summary: Marcar notificación como ignorada
      description: >
        Actualiza el estado de la notificación a IGNORADA.
        Solo el destinatario de la notificación puede realizar esta acción; de lo contrario devuelve 403.
        Si la notificación no existe, devuelve 404.
      tags:
        - Notificaciones
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la notificación
          schema:
            type: integer
      responses:
        '200':
          description: Notificación marcada como ignorada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado (la notificación pertenece a otro usuario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: ID de notificación no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notificación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/dispositivos/token:
    post:
      summary: Registrar o actualizar token FCM del dispositivo autenticado
      description: >
        Asocia el token de Firebase del dispositivo con la cuenta autenticada.
        El usuarioId y el tipo CLIENTE/EMPLEADO se determinan en el servidor; no se aceptan del cliente.
      tags:
        - Dispositivos
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTokenDispositivoRequest'
      responses:
        '200':
          description: Token registrado o actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoResponse'
        '400':
          description: Token o plataforma no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta no tiene un cliente o empleado activo asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    TipoDestinatario:
      type: string
      enum: [CLIENTE, EMPLEADO]
      example: CLIENTE

    EstadoNotificacion:
      type: string
      enum: [PENDIENTE, LEIDA, IGNORADA]
      example: PENDIENTE

    PlataformaDispositivo:
      type: string
      enum: [ANDROID, IOS, WEB]
      example: ANDROID

    Notificacion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: Recordatorio de pago
        mensaje:
          type: string
          example: Tu membresía vence en 3 días.
        tipo:
          type: string
          example: GENERAL
        destinatarioId:
          type: integer
          example: 15
        destinatarioTipo:
          $ref: '#/components/schemas/TipoDestinatario'
        remitenteId:
          type: integer
          nullable: true
          example: 3
        sucursalId:
          type: integer
          nullable: true
          example: 1
        estado:
          $ref: '#/components/schemas/EstadoNotificacion'
        leidaAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-20T10:00:00.000Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-20T08:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-20T08:30:00.000Z'
      required:
        - id
        - titulo
        - mensaje
        - tipo
        - destinatarioId
        - destinatarioTipo
        - estado
        - createdAt
        - updatedAt

    CrearNotificacionRequest:
      type: object
      required:
        - titulo
        - mensaje
        - destinatarioId
        - destinatarioTipo
      properties:
        titulo:
          type: string
          maxLength: 150
          example: Bienvenido a ApexGym
        mensaje:
          type: string
          example: Nos alegra tenerte con nosotros. Revisa tus beneficios.
        tipo:
          type: string
          default: GENERAL
          example: GENERAL
        destinatarioId:
          type: integer
          description: ID del cliente o empleado destinatario
          example: 15
        destinatarioTipo:
          $ref: '#/components/schemas/TipoDestinatario'
        sucursalId:
          type: integer
          nullable: true
          description: Sucursal asociada (se guarda, no filtra según regla PLAN-006)
          example: 1

    RegistrarTokenDispositivoRequest:
      type: object
      required: [token, plataforma]
      properties:
        token:
          type: string
          maxLength: 768
          description: Token de registro FCM generado para este dispositivo
        plataforma:
          $ref: '#/components/schemas/PlataformaDispositivo'

    DispositivoRegistrado:
      type: object
      required: [id, tipo, plataforma, updatedAt]
      properties:
        id:
          type: integer
        tipo:
          $ref: '#/components/schemas/TipoDestinatario'
        plataforma:
          $ref: '#/components/schemas/PlataformaDispositivo'
        updatedAt:
          type: string
          format: date-time

    DispositivoResponse:
      type: object
      required: [data, statusCode, message, responseFlag]
      properties:
        data:
          $ref: '#/components/schemas/DispositivoRegistrado'
        statusCode:
          type: integer
          example: 200
        message:
          type: string
        responseFlag:
          type: integer
          example: 0

    NotificacionCountData:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          example: 3

    NotificacionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Notificacion'
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación exitosa
        responseFlag:
          type: integer
          description: 0 indica éxito en el estándar del backend
          example: 0
      required:
        - data
        - statusCode
        - message
        - responseFlag

    NotificacionesListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación exitosa
        responseFlag:
          type: integer
          example: 0
      required:
        - data
        - statusCode
        - message
        - responseFlag

    NotificacionCountResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificacionCountData'
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación exitosa
        responseFlag:
          type: integer
          example: 0
      required:
        - data
        - statusCode
        - message
        - responseFlag

    ErrorResponse:
      type: object
      properties:
        data:
          type: object
          nullable: true
          example: null
        statusCode:
          type: integer
          example: 403
        message:
          type: string
          example: No tienes permiso para realizar esta acción
        responseFlag:
          type: integer
          example: 1
      required:
        - data
        - statusCode
        - message
        - responseFlag
